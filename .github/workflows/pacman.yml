name: GitHub Pacman Game

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Ambil isi repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate animasi pacman ke subfolder dist/pacman/
      - name: Generate Pacman Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman/github-pacman.svg?type=pacman
            dist/pacman/github-pacman-dark.svg?type=pacman&palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Deploy ke subfolder pacman/ di branch output
      - name: Deploy Pacman to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pacman
          destination_dir: pacman
          publish_branch: output
          commit_message: "Update pacman animation [skip ci]"